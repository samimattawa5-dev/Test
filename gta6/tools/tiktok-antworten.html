<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Antworten</title>
<style>
:root{--bg:#0f1220;--card:#1a1f36;--tx:#eef1ff;--mut:#9aa3c7;--ac:#5fd8ff;--ok:#3ddc97;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:16px;max-width:560px;margin:auto}
h1{font-size:20px;margin:4px 0 12px}textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid #2c3354;background:var(--card);color:var(--tx);padding:12px;font:inherit}
button{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer}
.go{background:var(--ac);color:#04202b;width:100%;margin:10px 0}
.card{background:var(--card);border-radius:12px;padding:12px;margin:8px 0}
.tag{font-size:12px;color:var(--mut);margin-bottom:6px}.row{display:flex;gap:8px;align-items:flex-start}
.txt{flex:1}.cp{background:#2c3354;color:var(--tx);padding:8px 12px}.cp.done{background:var(--ok);color:#042}
.warn{border:1px solid var(--bad);color:var(--bad)}small{color:var(--mut)}
</style></head><body>
<h1>TikTok Kommentare beantworten</h1>
<small>Kommentar einfügen → Antwort kopieren → in TikTok einfügen. Nichts wird gesendet.</small>
<textarea id="in" placeholder="Kommentar hier einfügen…"></textarea>
<button class="go" id="go">Antwort vorschlagen</button>
<div id="out"></div>
<script>
const R={
praise:["Danke dir! 🙌 Welche Klasse spielst du?","Freut mich! 😊 Was gefällt dir am meisten?","Danke! 🔥 Spielst du schon WoW Forever?"],
cls:["Gute Frage! Und welche Klasse spielst du am liebsten?","Spannend, was würdest du wählen? 😄","Da gibt's bestimmt viele Meinungen, wie siehst du das?"],
release:["WoW Forever ist schon erschienen! 🎮","Das Spiel ist schon da, du kannst direkt loslegen! 🎮"],
music:["Die Musik ist aus dem offiziellen Trailer 🎵","Der Ton kommt aus dem offiziellen Blizzard-Video 🎵"],
price:["Alle Infos dazu gibt es beim offiziellen Blizzard-Account @blizzard_de 🙌","Dazu schaust du am besten bei Blizzard direkt vorbei (@blizzard_de) 🙌"],
q:["Gute Frage! Genaueres findest du bei Blizzard (@blizzard_de) 🙌","Das weiß ich leider nicht sicher, schau am besten beim offiziellen Account vorbei 🙌"],
def:["Danke fürs Anschauen! 🙌 Was gefällt dir am meisten?","Danke dir! 😊 Welche Zone würdest du zuerst besuchen?"]};
function classify(t){
 const s=t.toLowerCase().trim();
 if(!s) return null;
 if(/(https?:\/\/|www\.|follow ?back|f4f|sub ?4 ?sub|gewinnspiel|verdien|geld|dm mir|telegram|whatsapp|crypto|bitcoin)/.test(s)) return {k:"spam"};
 if(/(scheiße|scheisse|kacke|müll|muell|hurensohn|arsch|idiot|hass|fick|dumm|sucks|trash|cringe|schlecht|langweilig|bot)/.test(s)) return {k:"hate"};
 if(/(wann|release|erscheint|kommt)/.test(s)&&s.includes("?")) return {k:"release"};
 if(/(musik|song|lied|soundtrack)/.test(s)) return {k:"music"};
 if(/(kostet|preis|kostenlos|gratis|abo|kaufen|wie viel|wieviel)/.test(s)) return {k:"price"};
 if(/(klasse|volk|rasse|horde|allianz|main|build|talent)/.test(s)) return {k:"cls"};
 if(s.includes("?")) return {k:"q"};
 if(/^[\p{Emoji}\p{Extended_Pictographic}\s\p{P}]*$/u.test(s)||/(geil|nice|stark|krass|cool|top|mega|wow|schön|schoen|hammer|lecker|bock|hype|freu|love|liebe|gut)/.test(s)) return {k:"praise"};
 return {k:"def"};
}
function render(){
 const t=document.getElementById("in").value, c=classify(t), o=document.getElementById("out");
 o.innerHTML="";
 if(!c) return;
 if(c.k==="spam"||c.k==="hate"){
  o.innerHTML='<div class="card warn"><b>Nicht antworten.</b><br>'+(c.k==="spam"?'Sieht nach Spam/Werbung aus.':'Sieht nach Beleidigung oder Hate aus.')+' In TikTok: Kommentar lang drücken → <i>Melden</i> oder <i>Löschen</i>.</div>';
  return;
 }
 R[c.k].forEach(x=>{
  const d=document.createElement("div");d.className="card";
  d.innerHTML='<div class="row"><div class="txt"></div><button class="cp">Kopieren</button></div>';
  d.querySelector(".txt").textContent=x;
  const b=d.querySelector(".cp");
  b.onclick=async()=>{try{await navigator.clipboard.writeText(x)}catch(e){const a=document.createElement("textarea");a.value=x;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}b.textContent="Kopiert ✓";b.classList.add("done");setTimeout(()=>{b.textContent="Kopieren";b.classList.remove("done")},1500)};
  o.appendChild(d);
 });
}
document.getElementById("go").onclick=render;
</script></body></html>
